name: Public candidate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: git diff --check HEAD^ HEAD
      - run: bash tests/check_public_foundation.sh
      - run: bash tests/check_release_attribution.sh
      - run: npm ci --prefix mcp-worker
      - run: npm --prefix mcp-worker run check
      - run: git diff --exit-code
